[project]
name = "cryptosignal-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-ai>=0.8",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "I001", "F401"]

[tool.mypy]
python_version = "3.12"
packages = ["cryptosignal_copilot"]
mypy_path = "src"
strict = false
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptosignal_copilot.drawing_gate", "cryptosignal_copilot.model_factory"]
ignore_errors = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
