[project]
name = "cryptosignal-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  # OmniRoute speaks the OpenAI protocol; the full pydantic-ai pulls every provider SDK.
  "pydantic-ai-slim[openai]>=2.55,<3",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
libsql = ["sqlalchemy-libsql>=0.1"]
# Only for LLM_API_STYLE=anthropic (the anthropic SDK is imported lazily, on first use).
anthropic = ["pydantic-ai-slim[anthropic]>=2.55,<3"]
dev = [
  "pydantic-ai-slim[anthropic]>=2.55,<3",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "mypy>=1.14",
  "testcontainers[postgres]>=4.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "I001", "F401"]

[tool.mypy]
python_version = "3.12"
packages = ["cryptosignal_copilot"]
mypy_path = "src"
strict = false
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptosignal_copilot.drawing_gate", "cryptosignal_copilot.model_factory", "cryptosignal_copilot.agent"]
ignore_errors = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
