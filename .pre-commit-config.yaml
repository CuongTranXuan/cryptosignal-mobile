repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        name: ruff (apps/copilot)
        args: [--fix]
        files: ^apps/copilot/(src|tests)/
      - id: ruff-format
        name: ruff format (apps/copilot)
        files: ^apps/copilot/(src|tests)/
