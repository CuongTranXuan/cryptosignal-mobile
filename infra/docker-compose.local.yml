# Local development overlay. Always use with infra/docker-compose.yml:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.local.yml ...

services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptosignal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptosignal
      POSTGRES_USER: cryptosignal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptosignal}
    ports:
      - ${CRYPTO_SIGNAL_POSTGRES_BIND:-127.0.0.1:5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosignal -d cryptosignal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: test-runner
    container_name: cryptosignal-db-migrate
    env_file:
      - ${CRYPTO_SIGNAL_ENV_FILE:-../.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "migrate", "--config=drizzle.pg.config.ts"]
    restart: "no"

  web:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
