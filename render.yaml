# Render Blueprint — copilot FastAPI (free single instance).
# Create via Dashboard → New → Blueprint, or `render blueprint apply`.
# Set secret env vars in the dashboard (sync: false below).
services:
  - type: web
    name: cryptosignal-copilot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/copilot/Dockerfile
    dockerContext: ./apps/copilot
    healthCheckPath: /v1/copilot/health
    envVars:
      - key: LLM_API_STYLE
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_S
        value: "180"
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
