name: copilot

on:
  push:
    paths:
      - "apps/copilot/**"
      - "apps/web/lib/pattern-shape.ts"
      - "apps/web/lib/copilot-schema.ts"
      - ".github/workflows/copilot.yml"
  pull_request:
    paths:
      - "apps/copilot/**"
      - "apps/web/lib/pattern-shape.ts"
      - "apps/web/lib/copilot-schema.ts"
      - ".github/workflows/copilot.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # tests/test_wire_schema.py validates wire shapes/markers with the web Zod schema.
      COPILOT_REQUIRE_WEB_ZOD: "1"
    defaults:
      run:
        working-directory: apps/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web deps (Zod wire contract)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
