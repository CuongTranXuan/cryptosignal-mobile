name: copilot

on:
  push:
    paths:
      - "apps/copilot/**"
      - ".github/workflows/copilot.yml"
  pull_request:
    paths:
      - "apps/copilot/**"
      - ".github/workflows/copilot.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
